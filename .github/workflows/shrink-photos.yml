# When staff upload photos through the editor, shrink them for the web
# (see .github/scripts/shrink_photos.py) and commit the smaller files.
# Cloudflare redeploys on that commit by itself.
name: Shrink uploaded photos

on:
  push:
    branches: [main]
    paths: ["assets/uploads/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shrink-photos
  cancel-in-progress: false

jobs:
  shrink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Shrink photos
        run: python .github/scripts/shrink_photos.py

      - name: Commit the smaller photos
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Shrink uploaded photos for the web"
          git pull --rebase origin main
          git push
